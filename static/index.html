<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pace — reading speed trainer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23b4532a'/><path d='M8 22h16M8 16h11M8 10h6' stroke='white' stroke-width='3' stroke-linecap='round'/></svg>">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand"><span class="brand-mark"></span>Pace</a>
    <nav>
      <a href="#/" data-nav="home">Progress</a>
      <a href="#/library" data-nav="library">Library</a>
      <a href="#/history" data-nav="history">History</a>
      <a href="#/add" data-nav="add">Sources</a>
    </nav>
    <div class="top-actions">
      <button class="icon-btn" id="settingsBtn" title="Reading settings" aria-label="Reading settings">Aa</button>
    </div>
  </header>

  <div id="settingsPanel" class="settings-panel" hidden>
    <div class="set-row"><label>Theme</label>
      <div class="seg" data-setting="theme">
        <button data-v="light">Light</button><button data-v="sepia">Sepia</button><button data-v="dark">Dark</button>
      </div>
    </div>
    <div class="set-row"><label>Font</label>
      <div class="seg" data-setting="font">
        <button data-v="literata">Literata</button><button data-v="sourceserif">Source Serif</button><button data-v="inter">Inter</button>
      </div>
    </div>
    <div class="set-row"><label>Size</label><input type="range" min="15" max="26" step="1" data-setting="size"><span data-out="size"></span></div>
    <div class="set-row"><label>Line width</label><input type="range" min="480" max="900" step="20" data-setting="measure"><span data-out="measure"></span></div>
    <div class="set-row"><label>Line height</label><input type="range" min="1.4" max="2.0" step="0.05" data-setting="leading"><span data-out="leading"></span></div>
    <div class="set-row"><label>Show timer while reading</label><input type="checkbox" data-setting="showTimer"></div>
  </div>

  <main id="view"></main>
  <script src="/static/app.js"></script>
</body>
</html>
